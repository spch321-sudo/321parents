  --navy:#0b1323; --navy2:#1a2a4c; --gold:#e0b65a; --gold-soft:#3a3122; --on-navy:#f7f1e1;
  --c1:#6cc28a; --c1s:#1d3a2a; --c2:#ef8c78; --c2s:#43241f; --c3:#e9ad55; --c3s:#41321b;
  --c4:#7fb0ec; --c4s:#1d3150; --c5:#bb94e2; --c5s:#33264a; --ok:#6cc28a; --warn:#e9a35a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0 0 .8em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:1.08rem;font-weight:700;letter-spacing:.06em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--sans);font-size:.68rem;font-weight:400;letter-spacing:.12em;color:var(--gold);opacity:.95;line-height:1.2}
.ib{background:transparent;border:1px solid rgba(247,241,225,.25);color:var(--on-navy);border-radius:10px;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 10px;font-size:.85rem}
.ib svg{width:20px;height:20px}

main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.view{padding-block:18px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);text-decoration:none;font-size:.72rem;letter-spacing:.06em}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--gold)}
.tabs a[aria-current="page"] svg{stroke-width:2.2}

/* 卡片與通用 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3)}
.eyebrow{font-size:.72rem;letter-spacing:.16em;color:var(--gold);font-weight:700}
.btn{white-space:nowrap;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--navy2);color:var(--on-navy);border-color:var(--navy2)}
.btn.gold{background:var(--gold);color:#1c1405;border-color:var(--gold);font-weight:700}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{color:var(--c2);border-color:var(--c2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:1px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-t h2{font-size:1.15rem}
.sec-t a,.sec-t button{font-size:.82rem;color:var(--gold);background:none;border:0;text-decoration:none}

/* 階段色 */
.s1{--sc:var(--c1);--ss:var(--c1s)} .s2{--sc:var(--c2);--ss:var(--c2s)} .s3{--sc:var(--c3);--ss:var(--c3s)} .s4{--sc:var(--c4);--ss:var(--c4s)} .s5{--sc:var(--c5);--ss:var(--c5s)}
.stg{background:var(--ss);color:var(--sc);font-weight:700}

/* 首頁 */
.hero{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(224,182,90,.35);box-shadow:0 0 0 22px rgba(224,182,90,.06),0 0 0 48px rgba(224,182,90,.04)}
.hero q{display:block;font-family:var(--serif);font-size:1.22rem;line-height:1.7;quotes:none;position:relative;z-index:1}
.hero cite{display:block;margin-top:8px;font-style:normal;color:var(--gold);font-size:.82rem;letter-spacing:.1em}
.hero .r321{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.hero .r321 span{font-size:.72rem;border:1px solid rgba(224,182,90,.45);color:var(--gold);padding:1px 8px;border-radius:999px}

.road{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.road a{text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center;display:grid;gap:2px;position:relative}
.road a b{font-family:var(--serif);font-size:1.05rem;color:var(--sc)}
.road a i{font-style:normal;font-size:.66rem;color:var(--ink3)}
.road a .n{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.road a::before{content:"";position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px;background:var(--sc)}

.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:78px;height:78px}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--surface2)} .ring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font-family:var(--serif);font-size:20px;font-weight:700;fill:var(--ink)}

.vod{border-left:3px solid var(--gold);padding:4px 0 4px 14px}
.vod p{font-family:var(--serif);font-size:1.05rem;margin:0 0 4px}
.vod small{color:var(--gold);letter-spacing:.08em}

.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:.9rem}

/* 手冊目錄 */
.toc-stage{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.toc-stage .num{width:56px;height:56px;border-radius:14px;background:var(--ss);color:var(--sc);display:grid;place-items:center;font-family:var(--serif);font-size:1.5rem;font-weight:700}
.toc-stage h3{font-size:1.12rem}
.toc-stage p{margin:0;font-size:.85rem;color:var(--ink2);line-height:1.55}
.toc-stage .meta{font-size:.72rem;color:var(--ink3);text-align:right}
.toc-list a{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.toc-list a:last-child{border-bottom:0}
.toc-list b{font-family:var(--serif);font-weight:600}
.toc-list span{color:var(--ink3);font-size:.82rem}
.done-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}

/* 章節閱讀 */
.ch-head{padding:22px 0 10px}
.ch-head .big{font-family:var(--serif);font-size:3.2rem;line-height:1;color:var(--sc,var(--gold));font-weight:700}
.ch-head h2{font-size:1.7rem;margin-top:6px}
.ch-head .tag{color:var(--ink2);margin-top:4px}
.ch-head .one{margin-top:12px;font-family:var(--serif);font-size:1.08rem;background:var(--ss,var(--gold-soft));padding:12px 14px;border-radius:12px}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:10;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:.8rem;padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);text-decoration:none}
.blk{scroll-margin-top:120px;padding-top:26px}
.blk>h3{font-size:1.2rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.blk>h3::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--sc,var(--gold))}
.prose{max-width:65ch}
.prose b{color:var(--ink)}
.verse{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.verse p{font-family:var(--serif);margin:0 0 4px;font-size:1.02em}
.verse small{color:var(--gold);font-weight:700;letter-spacing:.06em}
.pic{background:var(--surface2);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.95em}
.pic b{display:block;font-family:var(--serif);color:var(--gold);margin-bottom:4px}
.mult{background:var(--ss,var(--gold-soft));border-radius:12px;padding:12px 14px;margin:12px 0}
.mult b{display:block;font-family:var(--serif);margin-bottom:4px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.three>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.three h4{font-size:1.25rem;color:var(--sc)}
.three p{margin:4px 0 2px;font-size:.88em}
.three small{display:block;color:var(--ink3);font-size:.74em}
.three em{display:block;font-style:normal;margin-top:6px;font-size:.8em;font-weight:700;color:var(--sc)}
ol.flow,ol.steps8{padding-left:1.4em}
ol.flow li,ol.steps8 li{margin-bottom:.4em}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.88em;min-width:460px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.55}
th{background:var(--surface2);font-weight:700;white-space:nowrap}
.mind{display:grid;gap:8px}
.mind>div{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.mind .h,.mind .g{border-radius:10px;padding:9px 11px;font-size:.92em;line-height:1.55}
.mind .h{background:var(--surface2);color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3);text-decoration-thickness:1px}
.mind .g{background:var(--ss,var(--gold-soft));color:var(--ink);font-weight:500}
.mind .ar{align-self:center;color:var(--sc,var(--gold));font-weight:700}
.mind .lbl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:.72rem;color:var(--ink3);letter-spacing:.1em}
.model{display:grid;gap:10px}
.model>div{display:grid;grid-template-columns:88px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.model h4{font-size:.9rem;color:var(--sc,var(--gold))}
.model p{margin:0;font-size:.94em}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--sc,var(--gold));color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
.steps b{display:block;font-family:var(--serif)}
.steps span{font-size:.94em;color:var(--ink2)}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.tool>summary{list-style:none;padding:12px 14px;font-family:var(--serif);font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary::after{content:"＋";color:var(--sc,var(--gold))}
.tool[open]>summary::after{content:"－"}
.tool .tb{padding:0 14px 14px}
.tool ul{margin:0;padding-left:1.2em}
.prayer{font-family:var(--serif);background:var(--surface2);border-radius:10px;padding:12px 14px;line-height:1.9}
.gospel{display:grid;gap:8px}
.gospel>div{border-left:3px solid var(--sc);padding:4px 0 4px 12px}
.gospel h5{margin:0;font-family:var(--serif);font-size:1rem}
.gospel q{display:block;quotes:none;font-family:var(--serif);font-size:.92em;color:var(--ink2)}
.gospel small{color:var(--gold);font-weight:700}
.gen{display:grid;gap:6px}
.gen>div{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.gen>div:nth-child(2){margin-left:14px}.gen>div:nth-child(3){margin-left:28px}.gen>div:nth-child(4){margin-left:42px}
.gen b{font-family:var(--serif);color:var(--sc)}
.qa details{border-bottom:1px solid var(--line);padding:10px 0}
.qa summary{font-weight:700;cursor:pointer;font-family:var(--serif)}
.qa details p{margin:8px 0 0;color:var(--ink2)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.5}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sc,var(--gold));flex:none}
.checks label:has(input:checked){background:var(--ss,var(--gold-soft));border-color:transparent}
.declare{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:18px;font-family:var(--serif);font-size:1.06rem;line-height:1.95}
.rate{display:grid;gap:8px}
.rate>div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:4px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:.8rem;padding:0;font-variant-numeric:tabular-nums}
.dots button.on{background:var(--sc,var(--gold));border-color:var(--sc,var(--gold));color:#fff}
.score{font-family:var(--serif);font-size:1.1rem}
textarea.note{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;line-height:1.7;resize:vertical}
.ch-nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.ch-nav a{flex:1;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem}
.ch-nav a b{display:block;font-family:var(--serif);font-size:1rem}
.ch-nav a.nx{text-align:right}

/* 家族 */
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:8px;font-size:.85rem;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.8rem}
.filter button.on{background:var(--navy2);color:var(--on-navy);border-color:var(--navy2)}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.av{width:44px;height:44px;border-radius:50%;background:var(--ss);color:var(--sc);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.1rem}
.person .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .sub{font-size:.8rem;color:var(--ink3);line-height:1.4}
.bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:5px;width:100%;max-width:200px}
.bar i{display:block;height:100%;background:var(--sc)}
.tree{overflow-x:auto;padding:6px 0 10px}
.tree ul{list-style:none;margin:0;padding-left:22px;position:relative}
.tree>ul{padding-left:0}
.tree li{position:relative;padding:5px 0 5px 0}
.tree ul ul li::before{content:"";position:absolute;left:-14px;top:0;bottom:50%;width:12px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:8px}
.tree ul ul li:not(:last-child)::after{content:"";position:absolute;left:-14px;top:50%;bottom:0;border-left:1.5px solid var(--line)}
.node{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:.9rem;white-space:nowrap}
.node .av{width:28px;height:28px;font-size:.85rem}
.node.me{background:var(--navy);color:var(--on-navy);border-color:var(--navy);padding-left:12px;font-family:var(--serif);font-weight:700}
.gen-l{font-size:.68rem;color:var(--ink3);margin-left:4px}
.empty{text-align:center;padding:26px 16px;color:var(--ink2)}
.empty h3{font-size:1.1rem;margin-bottom:6px}

/* 表單與底部面板 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.sheet h2{font-size:1.3rem}
.fld{display:grid;gap:4px}
.fld label{font-size:.8rem;color:var(--ink2);font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:.95rem}
.fld textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stagepick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stagepick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-family:var(--serif);font-weight:700;color:var(--sc)}
.stagepick button.on{background:var(--sc);color:#fff;border-color:var(--sc)}
.log{border-left:2px solid var(--line);padding:2px 0 8px 12px;margin-left:4px}
.log small{color:var(--gold);font-weight:700}
.log p{margin:2px 0 0;font-size:.92rem;white-space:pre-wrap}

/* 操練 */
.dlist{display:grid;gap:8px}
.ditem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ditem .bx{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.ditem.on{background:var(--gold-soft);border-color:transparent}
.ditem.on .bx{background:var(--gold);border-color:var(--gold);color:#1c1405}
.ditem b{display:block}
.ditem span{font-size:.82rem;color:var(--ink3)}
.fruits{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fruits button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-family:var(--serif);font-size:1rem}
.fruits button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;max-width:100%;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:.7rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.cal .l1{background:color-mix(in srgb,var(--gold) 30%,var(--surface2))}
.cal .l2{background:color-mix(in srgb,var(--gold) 60%,var(--surface2));color:var(--ink)}
.cal .l3{background:var(--gold);color:#1c1405;font-weight:700}
.cal .td{outline:2px solid var(--navy2);outline-offset:1px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;font-variant-numeric:tabular-nums}

/* 工具 */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start}

.tcard span{font-size:.8rem;color:var(--ink3);line-height:1.5}

.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.bars i{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.idx a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.idx a small{color:var(--gold);font-weight:700;margin-right:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);background:var(--navy2);border:1px solid var(--gold);color:var(--on-navy);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.reading{background:var(--gold-soft)!important;border-radius:6px}

@media (max-width:420px){
  .three{grid-template-columns:1fr}
  .mind>div,.mind .lbl{grid-template-columns:1fr}
  .mind .ar{transform:rotate(90deg);justify-self:center}
  .mind .lbl{display:none}
  .model>div{grid-template-columns:1fr;gap:4px}
  .tgrid{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .road a i{display:none}
}

<script>
var BOOKS = {};
function V(ref, text) { return { ref: ref, text: text }; }

/* 屬靈父母手冊 — 內容資料（經文採和合本，專有名詞採現代通行譯名） */
BOOKS.zh = {
  lang: 'zh',
  title: '屬靈父母手冊',
  subtitle: '落實321・五育成全屬靈家族',
  motto: '你們學基督的，師傅雖有一萬，為父的卻是不多，因我在基督耶穌裡用福音生了你們。',
  mottoRef: '哥林多前書 4:15',

  /* ───────── 序章 ───────── */
  intro: [
    {
      id: 'call', no: '序一', title: '為父的卻是不多', tag: '屬靈父母的呼召',
      verses: [
        V('哥林多前書 4:15', '你們學基督的，師傅雖有一萬，為父的卻是不多，因我在基督耶穌裡用福音生了你們。'),
        V('馬太福音 28:19-20', '所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗。凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。'),
      ],
      body: `
<p>保羅一句話道盡了教會的困境：<b>師傅一萬，父親不多。</b>師傅傳授知識，下課就走；父親傳遞生命，一生同行。師傅看重學生懂不懂，父親看重孩子活不活得好、長不長得大、能不能成家立業，將來也作父親。</p>
<p>今天許多教會不缺講台、不缺課程，缺的是願意「把自己的生命也給人」的屬靈父母。主耶穌的大使命不是「使萬民作會友」，而是「使萬民作我的門徒」：去、施洗、教訓他們遵守。這正是一位父母從懷胎、生產、哺育、教養到孩子成家的完整過程。</p>
<div class="pic"><b>比喻・孤兒院與家</b>孤兒院有床、有飯、有課程，卻沒有一個人叫你「我的孩子」。家可能簡陋，卻有父母認得你的名字、記得你的生日、半夜為你起來。教會若只是一間管理完善的孤兒院，屬靈的嬰孩就會營養不良、早早夭折；教會若是一個家，每個人都有屬靈父母，就會代代興旺。</div>
<p>屬靈父母不是少數屬靈偉人的專利。只要你已經從神生，你就有神的生命；有生命，就能生養生命。這本手冊要陪伴國度的家人，一步一步學會作屬靈父母。</p>`,
      reflect: ['我信主以來，生命中誰是我的「屬靈父母」？他們做了什麼讓我長大？', '我目前比較像「師傅」還是「父母」？為什麼？'],
    },
    {
      id: 'base', no: '序二', title: '屬靈父母的根基', tag: '321理念',
      verses: [
        V('約翰福音 13:15', '我給你們作了榜樣，叫你們照著我向你們所做的去做。'),
        V('提摩太後書 3:16-17', '聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的，叫屬神的人得以完全，預備行各樣的善事。'),
        V('約翰福音 16:13', '只等真理的聖靈來了，他要引導你們明白一切的真理；因為他不是憑自己說的，乃是把他所聽見的都說出來，並要把將來的事告訴你們。'),
      ],
      body: `
<p>房子蓋多高，看地基挖多深。屬靈父母若沒有根基，帶人越多，倒塌得越大。321理念是屬靈父母的地基、樑柱與方向：</p>
<table class="grid3"><thead><tr><th>321</th><th>內容</th><th>在作屬靈父母上的意義</th></tr></thead><tbody>
<tr><td rowspan="3"><b>三個基礎</b></td><td>耶穌是我的榜樣</td><td>我怎樣帶人，看耶穌怎樣帶門徒：揀選、同在、教導、差遣、捨命。</td></tr>
<tr><td>聖經是我的準則</td><td>我教的不是我的意見，是神的話；我的方法也要合乎聖經。</td></tr>
<tr><td>聖靈是我的引導</td><td>認領誰、何時開口、怎樣陪伴，都求聖靈帶領，不靠自己聰明。</td></tr>
<tr><td rowspan="2"><b>兩個核心</b></td><td>讓耶穌作王</td><td>兒女不是我的兒女，是神的兒女；我不作他的王，要帶他讓耶穌作王。</td></tr>
<tr><td>讓耶穌得到一切的榮耀</td><td>兒女長大了，功勞不歸我；一切都是神在耶穌裡所作成的。</td></tr>
<tr><td><b>一個目的</b></td><td>建立屬神的體系</td><td>一代傳一代，在地上建立屬神的領域，使主禱文成就：願人都尊主的名為聖，願你的國降臨。</td></tr>
</tbody></table>
<div class="pic"><b>比喻・水管與水源</b>屬靈父母是水管，不是水源。水管越乾淨、越暢通，活水就越多流到兒女身上；水管若想作水源，自己就乾了，兒女也渴了。</div>`,
      reflect: ['三個基礎中，我最常忽略哪一個？', '我帶人時，有沒有不知不覺想要「作他的王」？'],
    },
    {
      id: 'map', no: '序三', title: '五育藍圖', tag: '認領・生育・養育・教育・衍育',
      verses: [
        V('約翰一書 2:13', '父老啊，我寫信給你們，因為你們認識那從起初原有的。少年人哪，我寫信給你們，因為你們勝了那惡者。小子們哪，我曾寫信給你們，因為你們認識父。'),
        V('提摩太後書 2:2', '你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。'),
      ],
      body: `
<p>肉身的父母有一條清楚的路：懷胎、生產、哺乳、教養、成家。屬靈父母也一樣，本手冊稱為<b>「五育」</b>：</p>
<ol class="flow">
<li><b>認領</b>（懷胎）在禱告中把人認作神託付給我的，用愛孕育，傳福音，直到他心門打開。</li>
<li><b>生育</b>（出生）清楚傳講福音，帶他信主、決志、受洗，新生命誕生。</li>
<li><b>養育</b>（哺乳）用神的話和愛的陪伴牧養他，直到他能自己吃、自己走。</li>
<li><b>教育</b>（教養）用身教、言教、命教，把基督的生命和321理念傳給他。</li>
<li><b>衍育</b>（成家）讓他也成為屬靈父母，生出屬靈孫子，代代傳承。</li>
</ol>
<p>約翰一書把屬靈生命分成三個階段：<b>小子</b>認識父（被愛、被餵養），<b>少年人</b>勝了那惡者（剛強、有神的道），<b>父老</b>認識那從起初原有的（深知神、能生養別人）。五育就是陪一個人從小子走到父老。</p>
<p>五育也和 920、235 的生命操練緊緊相連：</p>
<ul>
<li><b>920</b>：每個和我有關係的人是我的「2」，我操練活出無己的「0」，結出聖靈九種果子的「9」。認領的人就在我的 920 裡。</li>
<li><b>235</b>：和無己的人成為「2」屬靈同伴，建立「3」屬靈父母兒女的關係，成為「5」五重職份的屬靈戰友團隊。五育正是建立「3」，並且長成「5」。</li>
</ul>`,
      reflect: ['我現在身邊的人，各自在五育的哪一個階段？', '我自己在約翰一書的哪一個階段？'],
    },
    {
      id: 'life', no: '序四', title: '屬靈父母的生命', tag: '無己・先生命再關係後事工',
      verses: [
        V('加拉太書 2:20', '我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。'),
        V('約翰福音 3:30', '他必興旺，我必衰微。'),
        V('雅各書 4:6', '但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。'),
      ],
      body: `
<p>作屬靈父母最大的敵人不是撒但，也不是忙碌，而是<b>「有己」</b>：我要被需要、我要被感謝、我要兒女聽我的、我要我的團隊人多。有己的父母會生出有己的兒女，驕傲激起驕傲，兩敗俱傷。</p>
<p><b>無己</b>不是沒有，乃是讓基督在我裡面活，進入無限、活出無限。施洗約翰是無己的屬靈父母：他把自己的門徒交給耶穌，還說「他必興旺，我必衰微」。</p>
<div class="pic"><b>比喻・伴郎</b>施洗約翰說自己是新郎的朋友（約3:29）。伴郎最開心的，是看見新娘歸給新郎，而不是新娘愛上伴郎。屬靈父母要把兒女帶到耶穌面前，讓他愛上耶穌，不是愛上我。</div>
<p>屬靈父母的次序是<b>先生命、再關係、後事工</b>：</p>
<ul>
<li><b>生命</b>：我先與神有關係，每天被神餵養，才有奶可以餵人。</li>
<li><b>關係</b>：人比事重要，關係比東西重要。不要為了事而傷害人，不要為了進度而破壞關係。</li>
<li><b>事工</b>：陪讀、小組、受洗班都是工具，是生命與關係的果子，不是目的。</li>
</ul>
<p>關係的次序也要清楚：先建立與神的關係，再建立與自己的關係，再建立與人的關係，最後才是與事的關係。</p>`,
      reflect: ['帶人時，我最容易從哪裡冒出「有己」？（被需要、被感謝、看數字…）', '我今天與神的關係，有足夠的「奶」可以餵養別人嗎？'],
    },
    {
      id: 'use', no: '序五', title: '如何使用本手冊', tag: '改變觀念的八大步驟',
      verses: [
        V('羅馬書 12:2', '不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。'),

      body: `

      meaning: `
<p>養育讓孩子活下來，教育讓孩子長成人。屬靈教育不是開課，而是<b>生命影響生命</b>。保羅說「你們在我身上所學習的、所領受的、所聽見的、所看見的」，四個動詞涵蓋了三種教育：</p>
<div class="three">
<div><h4>身教</h4><p>活出來給他看</p><small>榜樣：所看見的</small><em>身教讓人相信</em></div>
<div><h4>言教</h4><p>講清楚給他聽</p><small>真理：所聽見的</small><em>言教讓人明白</em></div>
<div><h4>命教</h4><p>捨命愛他到底</p><small>犧牲：所領受的</small><em>命教讓人改變</em></div>

        V('罗马书 10:9-10', '你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。因为人心里相信，就可以称义；口里承认，就可以得救。'),
        V('使徒行传 2:38', '彼得说：你们各人要悔改，奉耶稣基督的名受洗，叫你们的罪得赦，就必领受所赐的圣灵。'),
        V('罗马书 6:4', '所以，我们藉著洗礼归入死，和他一同埋葬，原是叫我们一举一动有新生的样式，像基督藉著父的荣耀从死里复活一样。'),
      ],
      meaning: `
<p>保罗说：「我在基督耶稣里<b>用福音生了你们</b>。」属灵生育就是用福音把人生到神的家里。重生是圣灵的工作（约3:6），但神乐意使用属灵父母作「接生」的人：清楚传讲福音、邀请回应、陪他走过决志与受洗。</p>
<p><b>决志</b>像婴儿出生：生命已经开始。<b>受洗</b>像报户口、挂上家族的姓：公开归入基督，归入神的家。两者都需要父母在场。</p>
<div class="pic"><b>比喻・产房外的父亲</b>孩子出生那一刻，父亲不会说「生了就好，我先去忙」。他会守在旁边、抱起孩子、记下时间，往后每年庆祝这一天。属灵父母也要守在新生命旁边，记下他的属灵生日，往后每年为他庆祝、为他祝福。</div>`,
      mindset: [
        ['我要说服他相信。', '圣灵叫人为罪、为义、为审判自己责备自己（约16:8）；我只需清楚传讲，让圣灵作工。'],
        ['福音是一套道理。', '福音是一位活的主耶稣，是请他从「我作王」改为「让耶稣作王」。'],
        ['他决志了，任务完成。', '决志是出生，不是毕业；生了就要立刻开始养。'],
        ['受洗要等他变得很好。', '受洗是信而顺服的开始，是入学典礼，不是毕业典礼；预备的重点是明白与真心，不是完美。'],
        ['带人信主是我的成绩。', '人是从神生的；我只是接生的，荣耀全归给耶稣。'],

      model: {
        jesus: '耶稣在井旁与撒马利亚妇人谈话（约4章），从「水」谈到「活水」，从她的需要谈到她的罪，最后她认出耶稣是基督，回城去作见证。耶稣从对方的需要开始，最后指向自己。',
        bible: '福音的内容由圣经决定：神的爱、人的罪、基督的死与复活、人的悔改与信靠（林前15:3-4）。不加不减，不用人的意见取代。',
        spirit: '传福音前，先求被圣灵充满；传的时候，留意圣灵在对方心里的工作：他眼眶红了、他沉默了、他开始问问题，那是收割的时候。',
      },
      steps: [
        { t: '预备自己', d: '传福音前先认罪、祷告，求圣灵充满。带著爱，不带著胜负心。请一两位同伴同时为这次分享代祷。' },
        { t: '从他的需要开始', d: '从他的困境、问题或盼望切入，例如压力、关系、意义、死亡。让他知道福音和他的人生有关。' },
        { t: '清楚传讲福音', d: '用「福音四步」清楚说明：神爱你、人有罪（有己自己作王）、耶稣为你死而复活、你要回应让耶稣作王。简单、清楚、有经文。' },
        { t: '邀请回应', d: '温柔而清楚地问：「你愿意现在接受耶稣作你生命的主和救主吗？」若愿意，带他一句一句作决志祷告；若还不愿意，尊重他，约好再谈。' },
        { t: '给他得救的确据', d: '用约翰一书 5:12-13 让他知道：得救不是凭感觉，而是凭神的应许。告诉他：「从今天起，你是神的儿女了。」记下属灵生日。' },
        { t: '48 小时内跟进', d: '新生儿最脆弱的是头两天。隔天就联络他，陪他读第一段经文（建议约翰福音），教他第一句祷告，介绍他认识一两位弟兄姊妹。' },
        { t: '陪他预备受洗', d: '用「受洗预备四课」帮他明白救恩、洗礼、新生命与教会家庭。陪他写受洗见证，受洗当天在场、为他祝福，并与家人一同庆祝。' },
      ],
      tools: [
        { t: '福音四步', type: 'gospel', items: [
          { h: '一、神爱你', v: '约翰福音 3:16', vt: '「神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不致灭亡，反得永生。」', d: '神创造你，也深深爱你，祂要你有丰盛的生命。' },
          { h: '二、人有罪', v: '罗马书 3:23；6:23', vt: '「因为世人都犯了罪，亏缺了神的荣耀。」「因为罪的工价乃是死；惟有神的恩赐，在我们的主基督耶稣里，乃是永生。」', d: '罪的根是「有己」：离开人的本位，自己作主作王，想代替神。结果是与神隔绝、生命失去方向。' },
          { h: '三、耶稣救你', v: '罗马书 5:8', vt: '「惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。」', d: '耶稣的死解决了我们的罪行与罪性，耶稣的复活赐给我们新的生命。' },
          { h: '四、你要回应', v: '约翰福音 1:12', vt: '「凡接待他的，就是信他名的人，他就赐他们权柄作神的儿女。」', d: '悔改，从「我作王」转为「让耶稣作王」；相信，接待耶稣进入你的心。' },
        ] },
        { t: '决志祷告文', type: 'prayer', body: '亲爱的天父，我承认我是一个罪人，我一直自己作主、自己作王，离开了你。谢谢你爱我，差你的儿子耶稣为我死在十字架上，担当我的罪；我相信祂第三天从死里复活。主耶稣，我现在打开心门，接待你进入我的生命，作我的救主，作我的王。求你赦免我一切的罪，赐我新的生命，求圣灵住在我心里，引导我一生跟随你。谢谢你，从今天起我是神的儿女了。奉主耶稣基督的名祷告，阿们。' },
        { t: '决志后立刻做的五件事', type: 'list', items: ['记下属灵生日（日期、地点、陪伴的人），写进「家族」页', '用约翰一书 5:12-13 确认得救的确据', '送他一本圣经，从约翰福音开始读', '教他最简单的祷告：感谢、认罪、祈求、奉主名', '48 小时内再见面或通话，并介绍他认识一两位弟兄姊妹'] },
        { t: '受洗预备四课', type: 'table', head: ['课次', '主题', '经文', '重点'], rows: [
          ['第一课', '我得救了', '弗2:8-9；约一5:12-13', '得救本乎恩、也因著信；得救的确据'],
          ['第二课', '洗礼的意义', '罗6:3-4；太28:19', '与基督同死、同埋葬、同复活；公开归入基督'],
          ['第三课', '新生命的生活', '林后5:17；加2:20', '旧人有己变成新人无己；每日读经祷告、920'],
          ['第四课', '神的家', '来10:24-25；弗4:15-16', '教会是属灵家庭；属灵父母与同伴；聚会与服事'],
        ] },
        { t: '受洗见证框架', type: 'list', items: ['我信主以前的生活与观念', '我怎样认识耶稣、为何愿意让耶稣作王', '信主后神怎样改变我（观念、生命、生活、关系）', '我今天受洗，向神与众人宣告的心志', '感谢陪伴我的属灵父母和家人，把荣耀归给耶稣'] },
      ],
      qa: [
        { q: '他说「我再想想」，怎么办？', a: '尊重他，不要施压。可以问：「你最主要的顾虑是什么？」很多时候背后有一个具体的问题（家人、祖先、某种罪、对教会的印象）。约好下次见面，继续祷告。圣灵作工有时是一瞬间，有时是十年。' },
        { q: '家人反对受洗，或担心祭祖的问题？', a: '先肯定他孝顺的心，圣经也教导「当孝敬父母」。说明基督徒用另一种方式纪念祖先、孝敬长辈，例如追思礼拜、更多陪伴照顾父母。受洗时机可以和教会牧者一同祷告商量，但要帮助他坚定信心，同时用爱与尊重赢得家人。' },
        { q: '他问「好人为什么不能上天堂？」', a: '用比喻：考试及格要 60 分，神的标准是 100 分的圣洁，人再好也做不到（罗3:23）。得救不是靠成绩，是靠耶稣替我们考了满分，把成绩单送给我们（弗2:8-9）。重点不是「好人坏人」，是「谁作王」。' },
        { q: '决志后就失联了？', a: '早产儿需要保温箱。持续联络，但不要追债式地催促。寄一段经文、一句问候、一次邀约吃饭。检讨：是否决志太仓促、没有 48 小时跟进、没有带入属灵家庭。下一位新生命，就把跟进做得更早、更紧密。' },
      ],
      practice: ['背熟福音四步和四节经文', '向一位同伴完整练习讲一次福音（10 分钟内）', '向认领名单中的一位分享福音', '若有人决志：48 小时内完成跟进并记下属灵生日', '陪一位初信者上完受洗预备四课', '为一位受洗者写一张祝福卡'],
      discuss: ['你信主那天的情形是怎样的？谁在你身边？', '向人说明「罪」时，为什么「有己、自己作王」比「做坏事」更能说到根？', '你最怕被问到哪个问题？我们一起想想怎么回答。', '你的教会在「决志后 48 小时」做得如何？可以怎么改进？'],
      declare: '我宣告：福音本是神的大能，要救一切相信的。我不以福音为耻，我要清楚传讲耶稣。人是从神生的，圣灵使人重生；我愿作神手中接生的器皿。每一个新生命，我都要守在他身边，陪他受洗归入基督，一切荣耀归给耶稣！',
      check: ['我能清楚、简洁地说明福音', '我能自然地邀请人回应', '我懂得带人作决志祷告', '我能给初信者得救的确据', '我在 48 小时内跟进新决志者', '我能陪人预备受洗'],
      milestones: ['听完整福音', '决志信主', '得救确据', '48小时跟进', '受洗预备四课', '受洗'],

    /* 3 养育 */
    {
      id: 'yangyu', no: 3, name: '养育', full: '属灵养育', tag: '牧养・喂养属灵儿女',

        V('帖撒罗尼迦前书 2:7-8', '只在你们中间存心温柔，如同母亲乳养自己的孩子。我们既是这样爱你们，不但愿意将神的福音给你们，连自己的性命也愿意给你们，因你们是我们所疼爱的。'),

        V('希伯来书 10:24-25', '又要彼此相顾，激发爱心，勉励行善。你们不可停止聚会，好像那些停止惯了的人，倒要彼此劝勉。既知道那日子临近，就更当如此。'),

      meaning: `
<p>新生的婴儿不会自己找奶喝，不会自己翻身，更不会自己保护自己。他需要人定时喂、常常抱、细心看顾。属灵养育就是<b>用神的话喂养、用爱的陪伴抱著、用祷告的保护围绕</b>，直到他能自己读经祷告（自己吃）、自己聚会服事（自己走）。</p>
<p>耶稣对彼得说「你爱我吗？你喂养我的小羊」。养育的动力不是责任，是爱主；爱主的人就会爱主所爱的小羊。</p>
<div class="pic"><b>比喻・母亲的奶</b>母亲吃什么，奶里就有什么。属灵父母自己若天天被神的话喂饱，给出去的就是「纯净的灵奶」；自己若干枯，给的就只剩规条和疲惫。所以养育别人，从自己每天的晨更开始。</div>`,
      mindset: [
        ['带到教会，就交给牧师了。', '生了就要养；没有父母会把刚出生的婴儿丢在医院门口。'],
        ['养育就是帮他上课。', '养育是生命陪伴：一起吃饭、一起祷告、一起面对难处。'],

        ['他依赖我，表示我带得好。', '我要他依赖耶稣，不是依赖我；无己的父母让孩子爱上天父。'],
        ['他软弱，是他自己的问题。', '软弱的人更需要扶持；「我们坚固的人应该担代不坚固人的软弱」（罗15:1）。'],

        spirit: '每次见面前先祷告：「圣灵啊，他今天最需要的是什么？」有时是一段经文，有时是一顿饭，有时只是一句「我陪你」。',

        { t: '初信八周陪读', d: '用「初信八周陪读表」，每周一个主题、一段经文、一个操练。读完一起祷告，下周检讨。' },

<p>Paul names the church's problem in one sentence: <b>ten thousand guardians, but not many fathers.</b> A tutor passes on knowledge and leaves when class ends; a father passes on life and walks with you for a lifetime. A tutor asks whether the student understands. A father asks whether the child is thriving, growing up, able to build a home, and one day ready to become a father too.</p>
<p>Many churches today have no shortage of pulpits or programs. What they lack are spiritual parents willing to share their own lives. Jesus' Great Commission is not "make church members of all nations" but "make disciples of all nations": go, baptize, and teach them to obey. That is the whole journey of a parent, from pregnancy and birth through nursing and training until the child has a family of their own.</p>
<div class="pic"><b>Picture this: an orphanage and a home</b>An orphanage has beds, meals and classes, but no one who calls you "my child." A home may be simple, yet it has parents who know your name, remember your birthday and get up for you in the night. If the church is only a well-run orphanage, spiritual babies will be undernourished and die young. If the church is a family where everyone has spiritual parents, it will flourish generation after generation.</div>
<p>Spiritual parenthood is not reserved for a few spiritual giants. If you have been born of God, you carry God's life, and life can bring forth life. This handbook walks with the family of the Kingdom, step by step, as we learn to become spiritual parents.</p>`,
      reflect: ['Since I came to faith, who have been my spiritual parents? What did they do that helped me grow?', 'Am I more like a tutor or a parent right now? Why?'],

    {
      id: 'map', no: 'Prologue 3', title: 'The Five-Stage Blueprint', tag: 'Adopt · Birth · Nurture · Train · Multiply',
      verses: [
        V('1 John 2:13-14', 'I am writing to you, fathers, because you know him who is from the beginning. I am writing to you, young men, because you have overcome the evil one. I write to you, dear children, because you know the Father.'),
        V('2 Timothy 2:2', 'And the things you have heard me say in the presence of many witnesses entrust to reliable people who will also be qualified to teach others.'),

      body: `
<p>Natural parents follow a clear path: pregnancy, birth, nursing, training, and a home of their own. Spiritual parents do the same. This handbook calls it the <b>Five Stages</b>:</p>
<ol class="flow">
<li><b>Adopt</b> (pregnancy): In prayer, receive someone as entrusted to you by God; carry them in love and share the gospel until their heart opens.</li>
<li><b>Birth</b> (delivery): Share the gospel clearly and walk with them as they believe, commit their life and are baptized. New life is born.</li>
<li><b>Nurture</b> (nursing): Shepherd them with God's Word and loving presence until they can feed themselves and walk on their own.</li>
<li><b>Train</b> (raising): Pass on the life of Christ and the 321 Principles by example, by word and by laying down your life.</li>
<li><b>Multiply</b> (a new home): Help them become spiritual parents who raise spiritual grandchildren, generation after generation.</li>
</ol>
<p>First John describes three stages of spiritual life: <b>children</b>, who know the Father and need to be loved and fed; <b>young men</b>, who have overcome the evil one and are strong in God's Word; and <b>fathers</b>, who know him who is from the beginning and can raise others (1 John 2:12-14). The Five Stages walk a person from child to father.</p>
<p>The Five Stages are tied closely to the 920 and 235 practices:</p>
<ul>
<li><b>920</b>: Everyone I am in relationship with is my "2." I practice living a selfless "0" life and bear the "9" fruit of the Spirit. The people I adopt are part of my 920.</li>
<li><b>235</b>: With other selfless people I build "2" spiritual companionship, "3" spiritual parent-child relationships, and "5" five-fold ministry teams of spiritual comrades. The Five Stages build the "3" and grow it into the "5."</li>
</ul>`,
      reflect: ['Which of the Five Stages are the people around me in right now?', 'Which stage of 1 John am I in myself?'],

    {
      id: 'life', no: 'Prologue 4', title: 'The Life of a Spiritual Parent', tag: 'Selfless · Life first, then relationships, then ministry',
      verses: [
        V('Galatians 2:20', 'I have been crucified with Christ and I no longer live, but Christ lives in me. The life I now live in the body, I live by faith in the Son of God, who loved me and gave himself for me.'),
        V('John 3:30', 'He must become greater; I must become less.'),
        V('James 4:6', 'But he gives us more grace. That is why Scripture says: "God opposes the proud but shows favor to the humble."'),
      ],
      body: `
<p>The greatest enemy of a spiritual parent is not Satan, nor busyness, but a <b>self-centered</b> heart: I want to be needed, I want to be thanked, I want my children to listen to me, I want my team to be big. Self-centered parents raise self-centered children. Pride provokes pride, and everyone loses.</p>
<p>Being <b>selfless</b> does not mean becoming nothing. It means letting Christ live in me, entering the infinite and living out the infinite. John the Baptist was a selfless spiritual father. He handed his own disciples to Jesus and said, "He must become greater; I must become less."</p>
<div class="pic"><b>Picture this: the best man</b>John called himself the friend of the bridegroom (John 3:29). What makes the best man happiest is seeing the bride given to the groom, not seeing her fall for the best man. A spiritual parent brings children to Jesus so that they fall in love with Jesus, not with me.</div>
<p>The order for a spiritual parent is <b>life first, then relationships, then ministry</b>:</p>
<ul>
<li><b>Life</b>: I first walk with God and am fed by him every day. Only then do I have milk to feed others.</li>
<li><b>Relationships</b>: People matter more than tasks; relationships matter more than things. Never hurt people for the sake of a task, or damage relationships for the sake of progress.</li>
<li><b>Ministry</b>: Reading partnerships, small groups and baptism classes are tools, the fruit of life and relationship, not the goal.</li>
</ul>
<p>Relationships also have an order: first my relationship with God, then with myself, then with others, and only then with tasks.</p>`,
      reflect: ['When I lead people, where does my self-centeredness show up most? (being needed, being thanked, watching numbers...)', 'Is my relationship with God today full enough that I have "milk" to feed others?'],
    },

<p>Change your mindset and you change your life; change your life and you change how you live. Every chapter follows the <b>eight steps for changing mindsets</b>. Please don't just read through it. Walk through it:</p>

<li><b>Review</b>: Assess yourself honestly with the Self-Check.</li>

<p><b>Suggested ways to use it</b></p>
<ul>
<li><b>On your own</b>: One chapter a week, completing a round in five weeks. Each time someone new comes into your life, return to the chapter for the stage they are in.</li>
<li><b>Spiritual parent and child</b>: Read a section together each time you meet and share using the small-group questions.</li>

</ul>
<p>Use your heart and rely on the Spirit, not your head and yourself. Everything you do flows from the heart, and the Spirit lives in your heart, not in your head.</p>`,

          ['Lesson 3', 'Living the new life', '2 Cor 5:17; Gal 2:20', 'From the old self-centered self to the new selfless self; daily Bible and prayer; 920'],
          ['Lesson 4', "God's family", 'Heb 10:24-25; Eph 4:15-16', 'The church as a spiritual family; spiritual parents and companions; gathering and serving'],
        ] },
        { t: 'Baptism Testimony Framework', type: 'list', items: ['My life and mindset before I believed', 'How I came to know Jesus and why I chose to let him be King', 'How God has changed me since (mindset, life, daily living, relationships)', 'What I am declaring to God and to everyone through baptism today', 'Thanks to the spiritual parents and family who walked with me, giving the glory to Jesus'] },
      ],
      qa: [
        { q: 'They said, "Let me think about it." What now?', a: 'Respect that and don\'t pressure them. You might ask, "What is your main concern?" Often there is a specific issue behind it: family, ancestors, a particular sin, or an impression of the church. Set a time to meet again and keep praying. Sometimes the Spirit works in a moment; sometimes it takes ten years.' },
        { q: 'Their family opposes baptism, or worries about ancestor rites.', a: 'First affirm their desire to honor their parents; Scripture also teaches us to honor father and mother. Explain that Christians remember their ancestors and honor their elders in other ways, such as memorial services and spending more time caring for parents. Pray with your pastors about the timing of baptism, but help them stand firm in faith while winning their family with love and respect.' },
        { q: 'They ask, "Why can\'t good people go to heaven?"', a: 'Use an analogy: passing an exam takes 60 points, but God\'s standard is 100 points of holiness, and no one can reach it however good they are (Romans 3:23). Salvation isn\'t about our score. Jesus took the test for us, scored 100, and hands us his report card (Ephesians 2:8-9). The question isn\'t good people versus bad people; it is who sits on the throne.' },
        { q: 'They committed their life, then disappeared.', a: 'Premature babies need an incubator. Keep in touch, but don\'t chase them like a debt collector. Send a verse, a greeting, an invitation to a meal. Then review: was the commitment rushed? Was there no 48-hour follow-up? Were they never brought into a spiritual family? With the next new life, follow up sooner and more closely.' },
      ],
      practice: ['Memorize the Four Gospel Steps and their four verses', 'Practice sharing the full gospel with a companion (within 10 minutes)', 'Share the gospel with someone on your adoption list', 'If someone commits: follow up within 48 hours and record their spiritual birthday', 'Walk a new believer through the four baptism preparation lessons', 'Write a blessing card for someone being baptized'],
      discuss: ['What was the day you came to faith like? Who was with you?', 'When explaining sin, why does "a self-centered heart that makes itself king" reach the root better than "doing bad things"?', 'Which question are you most afraid of being asked? Let\'s think together about how to answer it.', 'How does your church do in the first 48 hours after a commitment? How could it improve?'],
      declare: 'I declare: the gospel is the power of God that brings salvation to everyone who believes. I am not ashamed of the gospel; I will share Jesus clearly. People are born of God, and the Holy Spirit gives new birth; I offer myself as a midwife in God\'s hands. I will stay close to every new life and walk with them into baptism in Christ. All the glory to Jesus!',
      check: ['I can explain the gospel clearly and simply', 'I can invite people to respond naturally', 'I know how to lead someone in a commitment prayer', 'I can give new believers assurance of salvation', 'I follow up new believers within 48 hours', 'I can help someone prepare for baptism'],
      milestones: ['Heard the full gospel', 'Committed to Christ', 'Assurance of salvation', '48-hour follow-up', 'Four baptism lessons', 'Baptized'],
    },

    {
      id: 'yangyu', no: 3, name: 'Nurture', full: 'Spiritual Nurture', tag: 'Shepherding · Feeding spiritual children',
      image: 'Nursing', color: 'c3',
      oneLine: 'Shepherd them with God\'s Word and loving presence until they can feed themselves and walk on their own.',
      verses: [
        V('1 Peter 2:2', 'Like newborn babies, crave pure spiritual milk, so that by it you may grow up in your salvation,'),
        V('1 Thessalonians 2:7-8', 'Instead, we were like young children among you. Just as a nursing mother cares for her children, so we cared for you. Because we loved you so much, we were delighted to share with you not only the gospel of God but our lives as well.'),
        V('John 21:15', 'When they had finished eating, Jesus said to Simon Peter, "Simon son of John, do you love me more than these?" "Yes, Lord," he said, "you know that I love you." Jesus said, "Feed my lambs."'),
        V('1 Peter 5:2-3', "Be shepherds of God's flock that is under your care, watching over them—not because you must, but because you are willing, as God wants you to be; not pursuing dishonest gain, but eager to serve; not lording it over those entrusted to you, but being examples to the flock."),
        V('Hebrews 10:24-25', 'And let us consider how we may spur one another on toward love and good deeds, not giving up meeting together, as some are in the habit of doing, but encouraging one another—and all the more as you see the Day approaching.'),
      ],
      meaning: `
<p>A newborn cannot find milk on its own, cannot roll over and certainly cannot protect itself. It needs someone to feed it on schedule, hold it often and watch over it carefully. Spiritual nurture means <b>feeding with God's Word, holding with loving presence and surrounding with the protection of prayer</b>, until they can read the Bible and pray on their own (feeding themselves) and gather and serve on their own (walking).</p>
<p>Jesus asked Peter, "Do you love me? Feed my lambs." The motivation for nurture is not duty but love for the Lord. Those who love the Lord love the lambs he loves.</p>
<div class="pic"><b>Picture this: a mother's milk</b>Whatever a mother eats ends up in her milk. If spiritual parents are filled with God's Word every day, what they give is "pure spiritual milk." If they are dry, all they have left to give is rules and fatigue. So nurturing others begins with your own morning time with God.</div>`,
      mindset: [
        ['Once they are in church, the pastor takes over.', 'Whoever gives birth must also nurture; no parent leaves a newborn at the hospital door.'],
        ['Nurture means helping them take classes.', 'Nurture means sharing life: eating together, praying together, facing hardship together.'],
        ['They should grow up on their own.', 'Babies need milk; an unfed baby does not grow up. It dies.'],
        ['If they depend on me, I am doing well.', 'I want them to depend on Jesus, not on me; selfless parents help their children fall in love with the Father.'],
        ['Their weakness is their own problem.', 'The weak need more support: "We who are strong ought to bear with the failings of the weak" (Romans 15:1).'],
      ],
      model: {
        jesus: 'After his resurrection, Jesus prepared a fire on the shore with fish and bread for his tired disciples and said, "Come and have breakfast" (John 21:12). He fed Peter\'s stomach first, then healed his heart, and only then entrusted him with his mission: life first, then relationship, then ministry.',
        bible: 'Scripture is both milk and solid food (Hebrews 5:12-14). What we feed people is God\'s Word, not our own stories. Experience can be shared, but only truth truly nourishes.',
        spirit: 'Before each meeting, pray, "Holy Spirit, what do they most need today?" Sometimes it is a verse, sometimes a meal, sometimes simply, "I\'m here with you."',
      },
      steps: [
        { t: 'Set a rhythm of presence', d: 'In the first month, meet face to face at least once a week and send a short greeting every day. After that, meet weekly and check in every two or three days. Consistency matters more than intensity.' },
        { t: 'Eight weeks of reading together', d: 'Use the Eight-Week New Believer Reading Plan: one theme, one passage and one practice each week. Pray together after reading, and review it the next week.' },
        { t: 'Teach a daily devotional habit', d: 'Teach them to pray with the Lord\'s Prayer and to read Scripture every day with Morning Reading 321, starting with ten minutes a day. You model it first, then invite them to lead.' },
        { t: 'Bring them into a spiritual family', d: 'Bring them into a small group, Sunday worship and the Air Fellowship, and help them get to know at least three brothers and sisters. One spiritual parent is not enough; they need a whole family.' },
        { t: 'Protect them in prayer', d: 'New believers often face spiritual battles: family opposition, old habits, doubts and temptation. Form a small prayer network and teach them to put on the full armor of God (Ephesians 6:10-18).' },
        { t: 'Walk with them through problems', d: 'When they fall, listen first, then open Scripture, and finally bring it to Jesus together to confess and receive forgiveness. Don\'t scold, don\'t give up and don\'t cover it up.' },
        { t: 'Lead them into 920', d: 'Help them see that the people around them are their "2." Starting at home, they practice selflessness and bear the fruit of the Spirit. Step by step they move from being nurtured to nurturing others.' },
      ],
      tools: [
        { t: 'Eight-Week New Believer Reading Plan', type: 'table', head: ['Week', 'Theme', 'Scripture', 'Practice this week'], rows: [
          ['Week 1', 'Assurance of salvation', '1 John 5:11-13', 'Memorize 1 John 5:12 and thank God daily'],
          ['Week 2', 'Learning to pray', 'Matt 6:9-13', 'Pray the Lord\'s Prayer once a day'],
          ['Week 3', 'Daily Bible reading', '2 Tim 3:16-17; Ps 119:105', 'Read a chapter of John daily and write one sentence'],
          ['Week 4', 'The presence of the Spirit', 'John 14:16-17; Gal 5:22-23', 'Ask daily to be filled with the Spirit; notice one fruit'],
          ['Week 5', 'Overcoming temptation', '1 Cor 10:13', 'Write down one temptation and ask your spiritual parent to pray'],
          ['Week 6', "God's family", 'Heb 10:24-25', 'Join a small group and get to know three brothers and sisters'],
          ['Week 7', 'The new selfless life', 'Gal 2:20; 2 Cor 5:17', 'Do one selfless act of service at home'],
          ['Week 8', 'Being a witness', 'Acts 1:8', 'Write a three-minute testimony and list your own adoption list'],
        ] },
        { t: 'Five Questions for Mentoring Conversations', type: 'list', items: ['How has God spoken to you this week?', 'What brought you joy this week? What was a struggle?', 'Which sentence from your Bible reading touched you most?', 'What do you want to put into practice this week?', 'How can I pray for you?'], note: 'After each conversation, add a note on the Family page.' },
        { t: 'Warning Signs and Responses', type: 'table', head: ['Warning sign', 'Possible cause', 'Response'], rows: [
          ['Messages read but not answered', 'Busyness, discouragement, being hurt', 'Reach out a different way, invite them to a meal, show care without pushing'],
          ['Missed two weeks of gatherings', 'Family pressure, work, disappointment', 'Visit them, understand what is really going on, pray together'],
          ['Back to old habits', 'Temptation, spiritual battle', 'Address it gently, help them confess, set up an accountability partner'],
          ['Starting to doubt their faith', 'New questions, new wounds', 'Don\'t fear questions; study Scripture together and suggest good resources'],
        ] },
      ],
      qa: [
        { q: 'They often don\'t reply to my messages. What should I do?', a: 'First look at your approach: maybe the messages are too long or feel like homework. Try a warm one-line greeting, an image with a verse, or simply suggest meeting. Also accept that everyone has their own pace. Love is patient (1 Corinthians 13:4).' },
        { q: 'There is obvious sin in their life. Should I correct it right away?', a: 'Asking a baby to run before it can walk is unreasonable. First let them be sure they are loved and accepted, then speak the truth in love at the right time. Sin must be faced, but in the right order: relationship first, correction second. When correcting, deal with the issue rather than attacking the person, and look together to Jesus for forgiveness and power.' },
        { q: 'I\'m busy with work and family. I really don\'t have time.', a: 'Fit nurture into the rhythm you already have: lunch together, school runs together, a call on the way to work, checking in together on Morning Reading 321. And don\'t carry it alone: bring them into a small group and share the load with companions. A little, consistently, beats a lot, occasionally.' },
        { q: 'They depend on me too much and ask me about everything.', a: 'That is a good start, but it needs to shift over time. When they ask a question, ask them back: "After reading the Bible and praying, what do you think God is saying?" Teach them to feed themselves. Widen their network so they get help from other brothers and sisters too. The goal is for them to fall in love with Jesus, not to be unable to live without you.' },
      ],
      practice: ['Agree on a regular rhythm of meeting with one spiritual child', 'Begin week one of the eight-week reading plan', 'Use the five mentoring questions each time you meet and log it on the Family page', 'Introduce them to three brothers and sisters', 'Form a prayer network of 2–3 people for them', 'Be fed by God\'s Word myself every day before I feed others'],
      discuss: ['When you were new in the faith, what did you need most but lack most?', 'Why is "one spiritual parent is not enough; they need a whole family" true?', 'Have you seen new believers drift away? What might have made a difference?', 'In your busy life, how can you nurture people "along the way"?'],
      declare: 'I declare: I love the Lord Jesus, so I feed his lambs. I am filled with God\'s Word every day, and what I give is pure spiritual milk. I care for others as gently as a nursing mother cares for her children; I do not lord it over them but am an example to the flock. Those I nurture will fall in love with Jesus and grow to maturity in him. All the glory to Jesus!',
      check: ['I meet regularly with my spiritual children', 'I feed them with God\'s Word, not only with my experience', 'I have taught them a daily devotional habit', 'I have brought them into a spiritual family', 'I pray for them and walk with them through spiritual battles', 'I help them depend on Jesus, not on me'],
      milestones: ['Regular meeting rhythm', 'Eight-week reading plan', 'Daily devotional habit', 'Part of a small group', 'Prays and reads on their own', 'Practicing 920'],
    },

    {
      id: 'jiaoyu', no: 4, name: 'Train', full: 'Spiritual Training', tag: 'By example · By word · By life',
      image: 'Raising', color: 'c4',
      oneLine: 'Pass on the life of Christ and the 321 Principles by example, by word and by laying down your life.',
      verses: [
        V('1 Corinthians 11:1', 'Follow my example, as I follow the example of Christ.'),
        V('Philippians 4:9', 'Whatever you have learned or received or heard from me, or seen in me—put it into practice. And the God of peace will be with you.'),
        V('Deuteronomy 6:6-7', 'These commandments that I give you today are to be on your hearts. Impress them on your children. Talk about them when you sit at home and when you walk along the road, when you lie down and when you get up.'),
        V('John 12:24', 'Very truly I tell you, unless a kernel of wheat falls to the ground and dies, it remains only a single seed. But if it dies, it produces many seeds.'),
        V('1 Thessalonians 2:11-12', 'For you know that we dealt with each of you as a father deals with his own children, encouraging, comforting and urging you to live lives worthy of God, who calls you into his kingdom and glory.'),
      ],
      meaning: `
<p>Nurture keeps a child alive; training helps a child grow up. Spiritual training is not running a course. It is <b>life shaping life</b>. Paul says, "Whatever you have learned or received or heard from me, or seen in me." Those four verbs cover three kinds of training:</p>
<div class="three">
<div><h4>By example</h4><p>Live it so they can see</p><small>Modeling: what they have seen</small><em>Example makes people believe</em></div>
<div><h4>By word</h4><p>Explain it so they can hear</p><small>Truth: what they have heard</small><em>Words make people understand</em></div>
<div><h4>By life</h4><p>Love them to the end</p><small>Sacrifice: what they have received</small><em>Self-giving makes people change</em></div>
</div>
<p>With only <b>words</b>, children can talk but not do. With <b>example</b> but no words, they see but don't understand why. Without <b>laying down your life</b>, everything else is just technique. Laying down your life is being the kernel of wheat that falls to the ground and dies: paying the price of time, money, emotional energy and reputation, even your own comfort and rights. Paul says, "We were delighted to share with you not only the gospel of God but our lives as well." That is training by life.</p>
<div class="pic"><b>Picture this: learning to ride a bike</b>No one learns to ride after one lecture on the principles of cycling. A father rides first so the child can see (example). He explains: look ahead and keep pedaling (word). Then he holds the back of the seat and runs alongside until he is out of breath with a scraped knee (life). Finally, without the child noticing, he gently lets go.</div>`,
      mindset: [
        ['Training means lecturing and classes.', 'Training means passing on life; courses are tools, life is the content.'],
        ['I must be perfect before I can teach.', 'I walk with them on the road of following Christ; even how I confess and repent is an example.'],
        ['They should listen to me.', 'They should listen to Jesus; I teach them to hear God for themselves through Scripture and the Spirit.'],
        ['The more I teach, the better.', 'Teach one thing, do one thing, complete one thing; changing mindsets means walking all eight steps.'],
        ['I\'ve given so much; they should be grateful.', 'Laying down your life seeks no return; when a kernel of wheat dies, it is dead, and the fruit belongs to God.'],
      ],
      model: {
        jesus: 'Jesus "appointed twelve that they might be with him and that he might send them out to preach" (Mark 3:14). Being with them was example, his teaching was word, the cross was life. Jesus washed his disciples\' feet and then said, "I have set you an example."',
        bible: 'Scripture is both the material and the standard for training (2 Timothy 3:16-17): teaching (what is right), rebuking (what is wrong), correcting (how to return to what is right) and training in righteousness (how to keep walking in it).',
        spirit: 'The true teacher is the Holy Spirit (John 14:26). After teaching, spiritual parents hand their children over to the Spirit: "Holy Spirit, please plant today\'s words in their heart."',
      },
      steps: [
        { t: 'Be with them: let them into your life', d: 'Invite them to eat with you, visit people with you, serve with you, even do household chores with you. What they see beside you outweighs what they hear from you.' },
        { t: 'Model it: the Five-Step Coaching Method', d: 'I do, you watch → I do, you help → you do, I help → you do, I watch → you do, others watch. Use it for prayer, leading Bible study, visiting, sharing the gospel and every other ministry.' },
        { t: 'Teach: pass on the 321 Principles systematically', d: 'Teach the Three Foundations, the Two Cores and the One Purpose in order, along with self-centered versus selfless, humility versus pride, and life first, then relationships, then ministry. Pair every idea with Scripture.' },
        { t: 'Practice: one assignment at a time', d: 'Give one concrete practice each week. At the next meeting, review it first: What did you do? What happened? What did you learn? What needs to change?' },
        { t: 'Correct: speak the truth in love', d: 'When you see a problem, say so, but privately, in love, addressing the issue rather than the person, and return together to Scripture (Ephesians 4:15). After correcting, affirm and accept them.' },
        { t: 'Lay down your life: pay a price for them', d: 'Show up when they need you most: the midnight call, the hospital visit, financial help, standing with them when they are misunderstood. This is not heroism; it is taking up your cross every day.' },
        { t: 'Release: let them begin to serve', d: 'Watch for their gifts and burdens, refer to the five-fold ministry (Ephesians 4:11), and let them start with small tasks, with room to make mistakes and plenty of encouragement.' },
      ],
      tools: [
        { t: 'Five-Step Coaching Method', type: 'table', head: ['Step', 'Roles', 'Example: leading prayer in a small group'], rows: [
          ['1. I do, you watch', 'I model, they observe', 'I lead prayer, then explain afterward why I did it that way'],
          ['2. I do, you help', 'I lead, they assist', 'I lead; they open or close in prayer'],
          ['3. You do, I help', 'They lead, I assist', 'They lead; I fill in where needed'],
          ['4. You do, I watch', 'They lead alone; I observe and give feedback', 'They lead; I observe and we review afterward'],
          ['5. You do, others watch', 'They start coaching others', 'They use the same method with their own spiritual children'],
        ] },
        { t: 'Training Self-Check Matrix', type: 'table', head: ['Relationship', 'By example (lived)', 'By word (explained)', 'By life (self-giving)'], rows: [
          ['With God', 'They see my daily time with God', 'I teach them how to read and pray', 'I give my best time to God first'],
          ['With self', 'They see me admit wrong and repent', 'I teach them self-centered vs. selfless', 'I lay down face and rights'],
          ['With others', 'They see how I love my family', 'I teach them 920 and 235', 'I spend time and pay a price for them'],
          ['With tasks', 'They see how I serve', 'I teach them life first, then relationships, then ministry', 'I give them the credit and the stage'],
        ], note: 'For each cell, ask: Have I done this? Have they seen it?' },
        { t: 'Three Stages of Spiritual Growth', type: 'table', head: ['Stage', '1 John 2:13', 'Needs', "Spiritual parent's role"], rows: [
          ['Children', 'Know the Father', 'Love, feeding, assurance', 'Mother: nursing, presence, protection'],
          ['Young men', 'Have overcome the evil one', 'Truth, practice, spiritual battle', 'Coach: teaching, training, correcting'],
          ['Fathers', 'Know him who is from the beginning', 'Vision, empowerment, team', 'Companion: releasing, blessing, co-working'],
        ] },
        { t: 'Teaching with the Eight Steps', type: 'list', items: ['Information: the one idea and verse for today', 'Revelation: be still together and ask the Spirit for light', 'Conviction: have them state God\'s perspective in their own words', 'Practice: decide one concrete thing to do this week', 'Review: ask about the results first next time', 'Correction: adjust the approach together', 'Repetition: practice the same idea for four weeks', 'Multiplication: have them teach this idea to someone else'] },
      ],
      qa: [
        { q: 'They made a mistake. How do I correct them without hurting the relationship?', a: 'Pray first and make sure your motive is love, not anger. Talk privately (Matthew 18:15). Affirm them first, then name the facts and the biblical standard specifically, and finally look for a way forward together and pray for them. Afterward, let your actions say, "I am still your spiritual parent. I haven\'t gone anywhere."' },
        { q: 'They know the Bible better than I do. Can I still train them?', a: 'Spiritual parenthood is not about who knows more, but about who is more willing to lay down self. You can learn knowledge from them; they can learn life from you. Humility inspires humility, and everyone wins.' },
        { q: 'I failed, and they saw it. What now?', a: 'This is one of the most valuable moments to teach by example. Be honest with them, confess to God, and apologize to people where needed. Let them see that Christians are not people who never fall, but people who know how to return to the cross when they do. Pride is what would lose them; humility will win them.' },
        { q: 'How do I know they have grown up?', a: 'Look at fruit, not years: they are fed by God\'s Word on their own; they pray first when trouble comes; they live out 920 at home and at work; they can share the gospel clearly; they begin to care for and lead others. When they start asking, "How do I lead someone?", they are ready for the Multiply stage.' },
      ],
      practice: ['Invite a spiritual child into one part of my life', 'Choose one ministry and begin the Five-Step Coaching Method', 'Assess myself honestly with the training self-check matrix', 'Teach them one 321 idea using the eight steps', 'Pay one concrete price for them (time, presence or support)', 'Observe and write down their gifts and burdens'],
      discuss: ['The person who influenced you most: did they shape you by example, by word or by laying down their life?', 'Why do we say "self-giving makes people change"? Share an example.', 'In the Five-Step Coaching Method, which step do you tend to get stuck on? Why?', 'Are you willing to admit your weaknesses in front of your spiritual children? What makes it hard?'],
      declare: 'I declare: I follow Christ, and I am willing to let others follow me. I live out Christ by example, explain the truth by word, and love others by laying down my life. I am willing to be a kernel of wheat that falls to the ground and dies, so that it produces many seeds. Those I train will grow to maturity in the truth, attaining to the whole measure of the fullness of Christ. All the glory to Jesus!',
      check: ['My life is worth following for my spiritual children', 'I can explain the 321 Principles and their scriptural basis', 'I am willing to pay a price for my spiritual children', 'I use the Five-Step Coaching Method to develop people', 'I can speak the truth in love', 'I discover others\' gifts and release them to serve'],
      milestones: ['Shares in my life', 'Learning the 321 Principles', 'Serving via five-step coaching', 'Open to correction', 'Gifts and burdens identified', 'Leading in ministry'],
    },

    {
      id: 'yanyu', no: 5, name: 'Multiply', full: 'Spiritual Multiplication', tag: 'Legacy · Children becoming parents',
      image: 'A new home', color: 'c5',
      oneLine: 'Help your spiritual children become spiritual parents who raise spiritual grandchildren, generation after generation.',
      verses: [
        V('2 Timothy 2:2', 'And the things you have heard me say in the presence of many witnesses entrust to reliable people who will also be qualified to teach others.'),
        V('3 John 1:4', 'I have no greater joy than to hear that my children are walking in the truth.'),
        V('John 15:8', "This is to my Father's glory, that you bear much fruit, showing yourselves to be my disciples."),
        V('Genesis 1:28', 'God blessed them and said to them, "Be fruitful and increase in number; fill the earth and subdue it. Rule over the fish in the sea and the birds in the sky and over every living creature that moves on the ground."'),
        V('Ephesians 4:11-12', 'So Christ himself gave the apostles, the prophets, the evangelists, the pastors and teachers, to equip his people for works of service, so that the body of Christ may be built up'),
      ],
      meaning: `
<p>Fruit is not meant to hang on the tree looking nice. It carries seeds that can grow into another tree. <b>Multiplication</b> means helping your spiritual children become spiritual parents who raise spiritual grandchildren and great-grandchildren. Second Timothy 2:2 spans four generations: <b>Paul → Timothy → reliable people → others</b>.</p>
<p>A spiritual parent is not measured by how many people surround them, but by <b>whether they have spiritual grandchildren</b>. Children without grandchildren is addition; children who have children is multiplication.</p>
<div class="mult"><b>The power of multiplication</b>Suppose every spiritual parent leads one person to faith each year and trains that person to become a spiritual parent too. After year 1 there are 2 people, after year 5 there are 32, after year 10 there are 1,024, after year 20 more than a million, and after year 30 more than a billion. The Great Commission is not completed by a few stars but by generation after generation of spiritual parents.</div>
<p>Multiplication also builds <b>235</b>: from the "3" of spiritual parent and child, you grow together into "2" spiritual companions, and finally stand side by side as a "5" five-fold ministry team. This is how we build a God-centered system on earth, so that "your kingdom come, your will be done, on earth as it is in heaven" is fulfilled.</p>`,
      mindset: [
        ['The more people I lead, the better.', 'Success is when those I lead can lead others; look at grandchildren, not just children.'],
        ['They are my people, my team.', 'They are God\'s children; I am only a steward. Let Jesus be King and let Jesus receive the glory.'],
        ['If I let go, I will lose them.', 'Letting go is how multiplication happens; a clenched fist cannot raise the next generation.'],
        ['They aren\'t good enough yet; let\'s wait.', 'Timothy was entrusted while young; faithfulness matters more than perfection, and people grow by serving.'],
        ['If they surpass me, I\'ll feel lost.', 'He must become greater; I must become less. Children surpassing their parents is a parent\'s greatest joy.'],
      ],
      model: {
        jesus: 'Jesus had only three years on earth, yet he entrusted his mission to eleven ordinary disciples, saying, "As the Father has sent me, I am sending you" (John 20:21). Then he ascended and handed the stage to them and to the Holy Spirit. Jesus is the spiritual father who knew best how to let go.',
        bible: 'From the beginning God blessed humanity to "be fruitful and increase in number; fill the earth" (Genesis 1:28), and the Great Commission is to "make disciples of all nations." Multiplication is God\'s heart, not a church-growth strategy.',
        spirit: 'After Pentecost, the church spread as the Spirit led: Philip, Peter, Barnabas, Paul, one bringing the next. Ask the Holy Spirit: among my children, who are the "reliable people who will also be qualified to teach others"?',
      },
      steps: [
        { t: 'Share the vision from day one', d: 'From the day they come to faith, tell them, "One day you will be a spiritual parent too." Let them know they are being nurtured so that they can nurture others.' },
        { t: 'Adopt alongside them', d: 'Draw their relationship map together, circle their adoption list and pray for it with them. Spiritual grandparents pray for their grandchildren too.' },

    case 'fs': S.fs = +el.dataset.n; save(); applyPrefs(); route(); break;
    case 'theme': S.theme = el.dataset.k; save(); applyPrefs(); route(); break;
    case 'engine': S.tts.engine = el.dataset.k; TTS.azureOk = null; save(); route(); break;
    case 'rateTts': S.tts.rate = +el.dataset.r; save(); if (TTS.audio) TTS.audio.playbackRate = S.tts.rate; route(); break;
    case 'export': { const s = JSON.stringify(S), ta = $('#bk'); ta.value = s; copyText(s, ta); } break;
    case 'download': try { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = T.backupFile(todayStr()); document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } catch (err) { toast(T.noDownload); } break;
    case 'import': try { const o = JSON.parse($('#bk').value); if (!o || !Array.isArray(o.family)) throw 0; S = Object.assign(DEF(o.lang || S.lang), o); save(); setLang(S.lang); applyPrefs(); buildChrome(); toast(T.imported); route(); } catch (err) { toast(T.badBackup); } break;
    case 'reset': if (el.dataset.sure) { const l = S.lang; S = DEF(l); S.family = []; save(); applyPrefs(); location.hash = '#home'; route(); toast(T.cleared); } else { el.dataset.sure = 1; el.textContent = T.sureClearAll; } break;
    case 'readHere': hidePop(); TTS.follow = true; speakAt(+el.dataset.si); break;
    case 'askSent': { const s = TTS.sents[+el.dataset.si]; hidePop(); openXz(T.xzAskSentence(s.text.trim())); } break;
    case 'xzQ': xzSend(el.dataset.q); break;
    case 'xzClear': S.chat = []; save(); if (xzCtl) xzCtl.abort(); refreshSheet(xzHtml()); toast(T.chatCleared); break;
  }
});
function route2() { const h = location.hash || '#home'; if (h === '#family' || h === '#home') { const y = scrollY; $('#main').innerHTML = `<div class="wrap view">${h === '#family' ? viewFamily() : viewHome()}</div>`; scrollTo(0, y); } }
function changeLang(l) {
  if (!BOOKS[l]) return;
  const hadOnlySamples = S.family.length && S.family.every(p => p.sample);
  setLang(l); if (hadOnlySamples) S.family = sampleFamily(l);
  save(); buildChrome(); route();
}
document.addEventListener('submit', e => {
  if (e.target.id === 'xzForm') { e.preventDefault(); if ($('#xzSend').dataset.stop) { if (xzCtl) xzCtl.abort(); return; } xzSend($('#xzText').value); return; }
  if (e.target.id !== 'pform') return; e.preventDefault();
  const f = e.target, id = f.dataset.id, vals = Object.fromEntries(new FormData(f).entries());
  if (!vals.name.trim()) return;
  let p = S.family.find(x => x.id === id);
  if (!p) { p = { id, ms: {}, logs: [] }; S.family.push(p); }
  Object.assign(p, { name: vals.name.trim(), rel: vals.rel.trim(), parent: vals.parent, bday: vals.bday, baptism: vals.baptism, last: vals.last, next: vals.next.trim(), prayer: vals.prayer.trim(), stage: +$('#f-stage').dataset.v || 1 });
  delete p.sample; save(); refreshSheet(personDetail(p)); route2(); toast(T.saved);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) { S.notes[t.dataset.note] = t.value; save(); }
  if (t.dataset.tq) { S.testimony[t.dataset.tq] = t.value; save(); const txt = testimonyText(), n = wordCount(txt); $('#tout').textContent = txt; $('#tcount').textContent = T.tCount(n, (n / T.perMin).toFixed(1)); }
  if (t.hasAttribute('data-calc')) { S.my = +$('#m-y').value; S.mn = +$('#m-n').value; save(); $('#calcOut').innerHTML = calcHtml(); }
  if (t.dataset.set) { const [a, b] = t.dataset.set.split('.'); S[a][b] = t.value.trim() || (a === 'tts' ? DEF_TTS : DEF_AI); TTS.azureOk = null; TTS.cache.clear(); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hidePop(); closeSheet(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'xzText' && !e.isComposing) { e.preventDefault(); $('#xzForm').requestSubmit(); }
});

/* ───── 啟動 ───── */
function buildChrome() {
  $('#tabs').innerHTML = TABS.map(k => `<a href="#${k}" data-t="${k}">${ic(k)}<span>${esc(T.tabs[k])}</span></a>`).join('');
  $('#topBack').innerHTML = ic('back'); $('#topSpeak').innerHTML = ic('speak'); $('#topGear').innerHTML = ic('gear');
  $('#topBack').setAttribute('aria-label', T.back); $('#topSpeak').setAttribute('aria-label', T.speak); $('#topGear').setAttribute('aria-label', T.settings); $('#langSeg').setAttribute('aria-label', T.switchLang); $('#topFont').setAttribute('aria-label', T.fontSize);
  $('#langSeg').innerHTML = LANGS.map(l => `<button data-l="${l}" lang="${UI[l].htmlLang}" aria-pressed="${l === S.lang}" title="${esc(UI[l].langFull)}">${esc(UI[l].langName === 'EN' ? 'EN' : UI[l].langName)}</button>`).join('');
  $('#xzFab').innerHTML = `${ic('spark')}<span>${esc(T.xz)}</span>`; $('#xzFab').setAttribute('aria-label', T.xzTitle);
  $('#ttsPrev').innerHTML = ic('prev'); $('#ttsNext').innerHTML = ic('next'); $('#ttsClose').innerHTML = ic('x'); $('#ttsFollow').innerHTML = ic('follow');
  $('#ttsPrev').setAttribute('aria-label', T.ttsPrev); $('#ttsNext').setAttribute('aria-label', T.ttsNext); $('#ttsClose').setAttribute('aria-label', T.ttsStop); $('#ttsFollow').setAttribute('aria-label', T.ttsResume); $('#ttsFollow').title = T.ttsResume;
}
function boot() {
  applyPrefs(); buildChrome();
  $('#topBack').onclick = () => { location.hash = location.hash.startsWith('#tool-') ? '#tools' : '#book'; };
  $('#topSpeak').onclick = () => TTS.playing ? ttsStop() : ttsStart();
  $('#topGear').onclick = () => { location.hash = '#tool-settings'; };
  $('#langSeg').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.l !== S.lang) changeLang(b.dataset.l); };
  $('#topFont').onclick = () => { const i = (FS.indexOf(S.fs) + 1) % FS.length; S.fs = FS[i]; save(); applyPrefs(); $('#topFont').textContent = FS_LABEL[i]; toast(`${T.fontSize}：${T.fsNames[i]}`); };
  $('#xzFab').onclick = () => openXz();
  $('#ttsPlay').onclick = ttsPause; $('#ttsPrev').onclick = () => speakAt(Math.max(0, TTS.i - 1)); $('#ttsNext').onclick = () => speakAt(TTS.i + 1);
  $('#ttsClose').onclick = () => ttsStop(); $('#ttsFollow').onclick = () => { TTS.follow = true; highlight(TTS.i); updateBar(); };
  $('#ttsRate').onclick = () => { const R = [0.8, 0.9, 1, 1.15, 1.3]; S.tts.rate = R[(R.indexOf(S.tts.rate) + 1) % R.length] || 1; if (TTS.audio) TTS.audio.playbackRate = S.tts.rate; save(); updateBar(); };
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  window.addEventListener('hashchange', route);
  route();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && IS_PWA) navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();

</script>
